<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todoアプリ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 16px;
    }

    .container {
      width: 100%;
      max-width: 560px;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 24px;
      text-align: center;
    }

    .input-area {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .input-area input {
      flex: 1;
      padding: 12px 16px;
      font-size: 15px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      outline: none;
      background: #fff;
      transition: border-color 0.2s;
    }

    .input-area input:focus {
      border-color: #6c63ff;
    }

    .input-area button {
      padding: 12px 20px;
      background: #6c63ff;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 22px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .input-area button:hover {
      background: #574fd6;
    }

    .input-area button:active {
      transform: scale(0.96);
    }

    .filters {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
    }

    .filter-btn {
      padding: 6px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 20px;
      background: #fff;
      font-size: 13px;
      cursor: pointer;
      color: #555;
      transition: all 0.2s;
    }

    .filter-btn.active {
      border-color: #6c63ff;
      background: #6c63ff;
      color: #fff;
    }

    .todo-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fff;
      padding: 14px 16px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      animation: slideIn 0.2s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .todo-item.done .todo-text {
      text-decoration: line-through;
      color: #aaa;
    }

    .checkbox {
      width: 22px;
      height: 22px;
      border: 2px solid #ccc;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .checkbox.checked {
      background: #6c63ff;
      border-color: #6c63ff;
    }

    .checkbox.checked::after {
      content: '✓';
      color: #fff;
      font-size: 13px;
      font-weight: bold;
    }

    .todo-text {
      flex: 1;
      font-size: 15px;
      color: #333;
      word-break: break-word;
    }

    .edit-input {
      flex: 1;
      font-size: 15px;
      border: none;
      border-bottom: 2px solid #6c63ff;
      outline: none;
      padding: 2px 4px;
      color: #333;
    }

    .actions {
      display: flex;
      gap: 6px;
    }

    .btn-icon {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-icon:active {
      transform: scale(0.92);
    }

    .btn-edit {
      background: #f0f0ff;
      color: #6c63ff;
    }

    .btn-edit:hover {
      background: #e0dfff;
    }

    .btn-delete {
      background: #fff0f0;
      color: #e05656;
    }

    .btn-delete:hover {
      background: #ffe0e0;
    }

    .btn-save {
      background: #e8f5e9;
      color: #43a047;
    }

    .btn-save:hover {
      background: #d0ebd1;
    }

    .footer {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #888;
    }

    .clear-btn {
      background: none;
      border: none;
      color: #e05656;
      font-size: 13px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .clear-btn:hover {
      background: #fff0f0;
    }

    .empty {
      text-align: center;
      color: #bbb;
      font-size: 15px;
      padding: 40px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📝 Todoアプリ</h1>

    <div class="input-area">
      <input type="text" id="todo-input" placeholder="タスクを入力..." maxlength="100">
      <button id="add-btn" title="追加">+</button>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">すべて</button>
      <button class="filter-btn" data-filter="active">未完了</button>
      <button class="filter-btn" data-filter="done">完了済み</button>
    </div>

    <div class="todo-list" id="todo-list"></div>

    <div class="footer">
      <span id="count-label"></span>
      <button class="clear-btn" id="clear-done">完了済みを削除</button>
    </div>
  </div>

  <script>
    let todos = JSON.parse(localStorage.getItem('todos') || '[]');
    let filter = 'all';
    let editingId = null;

    const input = document.getElementById('todo-input');
    const addBtn = document.getElementById('add-btn');
    const listEl = document.getElementById('todo-list');
    const countLabel = document.getElementById('count-label');
    const clearDoneBtn = document.getElementById('clear-done');

    function save() {
      localStorage.setItem('todos', JSON.stringify(todos));
    }

    function genId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2);
    }

    function addTodo() {
      const text = input.value.trim();
      if (!text) return;
      todos.unshift({ id: genId(), text, done: false });
      input.value = '';
      save();
      render();
    }

    function toggleTodo(id) {
      const t = todos.find(t => t.id === id);
      if (t) { t.done = !t.done; save(); render(); }
    }

    function deleteTodo(id) {
      todos = todos.filter(t => t.id !== id);
      if (editingId === id) editingId = null;
      save();
      render();
    }

    function startEdit(id) {
      editingId = id;
      render();
      const el = document.querySelector('.edit-input');
      if (el) { el.focus(); el.select(); }
    }

    function saveEdit(id) {
      const el = document.querySelector('.edit-input');
      if (!el) return;
      const val = el.value.trim();
      if (val) {
        const t = todos.find(t => t.id === id);
        if (t) t.text = val;
      }
      editingId = null;
      save();
      render();
    }

    function render() {
      const filtered = todos.filter(t => {
        if (filter === 'active') return !t.done;
        if (filter === 'done') return t.done;
        return true;
      });

      const activeCount = todos.filter(t => !t.done).length;
      countLabel.textContent = `未完了: ${activeCount} 件`;

      if (filtered.length === 0) {
        listEl.innerHTML = '<div class="empty">タスクがありません</div>';
        return;
      }

      listEl.innerHTML = '';
      filtered.forEach(todo => {
        const item = document.createElement('div');
        item.className = 'todo-item' + (todo.done ? ' done' : '');

        const checkbox = document.createElement('div');
        checkbox.className = 'checkbox' + (todo.done ? ' checked' : '');
        checkbox.onclick = () => toggleTodo(todo.id);

        const isEditing = editingId === todo.id;

        let content;
        if (isEditing) {
          content = document.createElement('input');
          content.className = 'edit-input';
          content.value = todo.text;
          content.onkeydown = e => {
            if (e.key === 'Enter') saveEdit(todo.id);
            if (e.key === 'Escape') { editingId = null; render(); }
          };
        } else {
          content = document.createElement('span');
          content.className = 'todo-text';
          content.textContent = todo.text;
          content.ondblclick = () => startEdit(todo.id);
        }

        const actions = document.createElement('div');
        actions.className = 'actions';

        if (isEditing) {
          const saveBtn = document.createElement('button');
          saveBtn.className = 'btn-icon btn-save';
          saveBtn.textContent = '✓';
          saveBtn.title = '保存';
          saveBtn.onclick = () => saveEdit(todo.id);
          actions.appendChild(saveBtn);
        } else {
          const editBtn = document.createElement('button');
          editBtn.className = 'btn-icon btn-edit';
          editBtn.textContent = '✏️';
          editBtn.title = '編集';
          editBtn.onclick = () => startEdit(todo.id);
          actions.appendChild(editBtn);
        }

        const delBtn = document.createElement('button');
        delBtn.className = 'btn-icon btn-delete';
        delBtn.textContent = '🗑️';
        delBtn.title = '削除';
        delBtn.onclick = () => deleteTodo(todo.id);
        actions.appendChild(delBtn);

        item.appendChild(checkbox);
        item.appendChild(content);
        item.appendChild(actions);
        listEl.appendChild(item);
      });
    }

    addBtn.onclick = addTodo;
    input.onkeydown = e => { if (e.key === 'Enter') addTodo(); };

    clearDoneBtn.onclick = () => {
      todos = todos.filter(t => !t.done);
      save();
      render();
    };

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.onclick = () => {
        filter = btn.dataset.filter;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
      };
    });

    render();
  </script>
</body>
</html>
